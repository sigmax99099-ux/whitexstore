  <!-- Main Products Store Area -->

      <!-- 7S PRODUCT CATEGORIES FILTER BAR -->

        <div class="category-header-row">
          <div class="category-title-group">

              PRODUCT CATEGORIES

              <input type="text" id="product-search-input" class="form-input" placeholder="🔍 Search game or cheat..." autocomplete="off">

          <span class="category-count-badge" id="category-items-count">
            Showing All (0 items)
          </span>
        </div>
        <div class="cat-pills-scroll" id="category-pills-list">
          <button type="button" class="cat-pill-btn active" data-category="All">ALL PRODUCTS (0)</button>
        </div>

      <!-- 7S PRODUCTS GRID -->
      <div class="store-grid" id="products-grid">

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0; justify-content: space-between;">

        <div>Support: WhatsApp & Discord Active 24/7</div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
  <script>
    let allProducts = [];
    let currentCategory = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      // Check query param for initial category filter
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('cat');
      if (catParam) {
        currentCategory = catParam;
      }
      
      if (typeof renderHeroSlider === 'function') {
        renderHeroSlider();
      }

      initSearch();
      fetchProducts();
    });

    function buildCategoryPills() {
      const container = document.getElementById('category-pills-list');
      if (!container) return;

      const counts = {};
      allProducts.forEach(p => {
        const cat = p.category || 'PC PANEL';
        counts[cat] = (counts[cat] || 0) + 1;
      });

      const categories = Object.keys(counts);
      let html = `
        <button type="button" class="cat-pill-btn ${currentCategory.toLowerCase() === 'all' ? 'active' : ''}" data-category="All">
          ALL PRODUCTS (${allProducts.length})
        </button>
      `;

      categories.forEach(cat => {
        const isActive = currentCategory.toLowerCase() === cat.toLowerCase();
        html += `
          <button type="button" class="cat-pill-btn ${isActive ? 'active' : ''}" data-category="${escapeHtml(cat)}">
            ${escapeHtml(cat.toUpperCase())} (${counts[cat]})
          </button>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll('.cat-pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.getAttribute('data-category');
          container.querySelectorAll('.cat-pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterAndRenderProducts();
        });
      });
    }

    function initSearch() {
      const input = document.getElementById('product-search-input');
      if (!input) return;
      input.addEventListener('input', () => {
        filterAndRenderProducts();
      });
    }

    async function fetchProducts(retryCount = 0) {
      const grid = document.getElementById('products-grid');
      try {
        if (window.location.protocol === 'file:') {
          throw new Error('Please open this page via your web server URL, not by opening the file directly.');
        }

        const res = await fetch('/api/products/list', { credentials: 'include' });
        if (!res.ok) {
          throw new Error(`Server returned status ${res.status}`);
        }
        const data = await res.json();
        if (data.success && Array.isArray(data.products)) {
          allProducts = data.products;
          buildCategoryPills();
          filterAndRenderProducts();
        } else {
          throw new Error(data.message || 'Invalid products response');
        }
      } catch (err) {
        if (retryCount < 2) {
          setTimeout(() => fetchProducts(retryCount + 1), 1200);
          return;
        }

        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding: 3rem 1rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; margin: 2rem 0;">
            <div style="font-size: 2.5rem; margin-bottom: 1rem;">⚠️</div>
            <h3 style="color: var(--danger); margin-bottom: 0.5rem; font-size: 1.25rem;">Unable to load products</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; max-width: 500px; margin: 0 auto 1.5rem;">
              ${err.message || 'Failed to connect to backend server.'}
            </p>
            <button class="btn btn-primary" onclick="fetchProducts(0)" style="display:inline-flex; align-items:center; gap:0.5rem;">
              <span>Retry Now</span> 🔄
            </button>
          </div>
        `;
      }
    }

    function filterAndRenderProducts() {
      const searchEl = document.getElementById('product-search-input');
      const query = (searchEl ? searchEl.value : '').toLowerCase().trim();
      const grid = document.getElementById('products-grid');
      const countEl = document.getElementById('category-items-count');

      let filtered = allProducts;

      if (currentCategory !== 'All') {
        filtered = filtered.filter(p => (p.category || '').toLowerCase() === currentCategory.toLowerCase());
      }

      if (query) {
        filtered = filtered.filter(p => 
          (p.name || '').toLowerCase().includes(query) || 
          (p.category || '').toLowerCase().includes(query) ||
          (p.description || '').toLowerCase().includes(query)
        );
      }

      if (countEl) {
        countEl.textContent = `Showing ${currentCategory === 'All' ? 'All' : currentCategory.toUpperCase()} (${filtered.length} item${filtered.length === 1 ? '' : 's'})`;
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-dim);">
            <h3>No products found matching your filter.</h3>
            <p style="margin-top: 0.5rem;">Try selecting "ALL PRODUCTS" or clear your search term.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => render7SProductCardHtml(p)).join('');
      if (typeof updateAllPricesOnPage === 'function') {
        updateAllPricesOnPage();
      }
    }
  </script>
</body>
