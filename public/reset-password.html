<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — White X Store</title>
  <meta name="description" content="Set a new password using your 8-character verification token on White X Store.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700;800&family=Orbitron:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/png" href="/assets/images/white-x-logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
  <div id="vanta-3d-bg" aria-hidden="true"></div>

  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="nav-brand">
        <img src="/assets/images/white-x-logo.png" alt="White X Logo" class="brand-logo-img">
        <div class="brand-text">WHITE <span>X</span> STORE</div>
      </a>
      <div class="nav-actions">
        <a href="/login.html" class="btn btn-outline btn-sm">Back to Login</a>
      </div>
    </div>
  </nav>

  <main class="section" style="min-height: calc(100vh - 180px); display: flex; align-items: center;">
    <div class="container" style="max-width: 440px;">
      
      <div class="product-card" style="padding: 2.2rem;">
        <div style="text-align: center; margin-bottom: 1.8rem;">
          <h2 style="font-size: 1.8rem; color: #fff;">SET NEW PASSWORD</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">
            Enter the 8-character token sent to your email or admin dispatch.
          </p>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label class="form-label" for="reset-email">Account Email</label>
            <input type="email" id="reset-email" class="form-input" placeholder="player@domain.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="reset-token">8-Character Reset Token</label>
            <input type="text" id="reset-token" class="form-input" placeholder="e.g. 7A8B9C0D" maxlength="8" required style="font-family: monospace; text-transform: uppercase; letter-spacing: 2px;">
          </div>

          <div class="form-group">
            <label class="form-label" for="reset-pass">New Password</label>
            <input type="password" id="reset-pass" class="form-input" placeholder="••••••••" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="reset-confirm-pass">Confirm New Password</label>
            <input type="password" id="reset-confirm-pass" class="form-input" placeholder="••••••••" required autocomplete="new-password">
          </div>

          <button type="submit" id="btn-reset-submit" class="btn btn-primary btn-block btn-lg btn-glow">
            Update Password ⚡
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
          Back to <a href="/login.html" style="color: var(--primary);">Login</a>
        </div>
      </div>

    </div>
  </main>

  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/three.r134.min.js"></script>
  <script src="/assets/js/vanta.globe.min.js"></script>
  <script src="/assets/js/3d-scene.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Pre-fill email and token if passed in query string
      const urlParams = new URLSearchParams(window.location.search);
      const emailParam = urlParams.get('email');
      const tokenParam = urlParams.get('token');

      if (emailParam) document.getElementById('reset-email').value = emailParam;
      if (tokenParam) document.getElementById('reset-token').value = tokenParam;

      const form = document.getElementById('reset-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('reset-email').value.trim();
        const token = document.getElementById('reset-token').value.trim().toUpperCase();
        const new_password = document.getElementById('reset-pass').value;
        const confirm_password = document.getElementById('reset-confirm-pass').value;
        const btn = document.getElementById('btn-reset-submit');

        if (new_password !== confirm_password) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        if (new_password.length < 6) {
          showToast('Password must be at least 6 characters long.', 'warning');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating Password...';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, token, new_password })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            showToast(data.message || 'Password reset failed.', 'error');
            btn.disabled = false;
            btn.textContent = 'Update Password ⚡';
            return;
          }

          showToast('Password updated successfully! Redirecting to login...', 'success');

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1000);

        } catch (err) {
          console.error('Reset error:', err);
          showToast('Server error. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Update Password ⚡';
        }
      });
    });
  </script>
</body>
</html>
