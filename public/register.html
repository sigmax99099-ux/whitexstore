<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — White X Store</title>
  <meta name="description" content="Register for a free White X Store account. Instant cheat key delivery, secure wallet balance, and reseller opportunities.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700;800&family=Orbitron:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/png" href="/assets/images/white-x-logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
  <div id="vanta-3d-bg" aria-hidden="true"></div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="nav-brand">
        <img src="/assets/images/white-x-logo.png" alt="White X Logo" class="brand-logo-img">
        <div class="brand-text">WHITE <span>X</span> STORE</div>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/products.html" class="nav-link">Cheats & Keys</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Register Form Main -->
  <main class="section" style="min-height: calc(100vh - 180px); display: flex; align-items: center;">
    <div class="container" style="max-width: 480px;">
      
      <div class="product-card" style="padding: 2.2rem;">
        <div style="text-align: center; margin-bottom: 1.8rem;">
          <img src="/assets/images/white-x-logo.png" alt="White X Logo" style="margin: 0 auto 0.75rem; width: 44px; height: 44px; font-size: 1.7rem; object-fit: contain; filter: drop-shadow(0 0 14px rgba(255,0,85,0.7));">
          <h2 style="font-size: 1.8rem; color: #fff;">REGISTER ACCOUNT</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Join thousands of competitive gamers & resellers</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name or Gamer Tag</label>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. ShadowViper" required autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="permanent@gmail.com" required autocomplete="email">
            <div style="font-size: 0.72rem; color: var(--text-dim); margin-top: 0.25rem;">
              * Note: Disposable/temporary email providers are prohibited.
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number (with country code)</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="+977 9800000000 or +91 9800000000" required autocomplete="tel">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (min 6 characters)</label>
            <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
          </div>

          <!-- Referral Code Input Field (Optional) -->
          <div class="form-group" style="position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
              <label class="form-label" for="reg-referral-code" style="margin-bottom: 0;">🎁 Referral Code (Optional)</label>
              <span id="ref-bonus-badge" style="font-size: 0.72rem; color: #34d399; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.25); border-radius: 4px; padding: 1px 6px; font-weight: 600;">
                + Both Get Wallet Bonus
              </span>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <input type="text" id="reg-referral-code" class="form-input" placeholder="e.g. WX-A1B2C3" style="text-transform: uppercase; font-family: var(--font-mono); font-weight: 700; letter-spacing: 1px;" autocomplete="off">
              <button type="button" id="btn-verify-referral" class="btn btn-outline btn-sm" style="padding: 0.5rem 0.85rem; font-size: 0.8rem; white-space: nowrap;">
                Verify Code
              </button>
            </div>
            <div id="referral-status-msg" style="font-size: 0.75rem; margin-top: 0.35rem; display: none;"></div>
          </div>

          <!-- Fake Captcha Widget -->
          <div id="captcha-slot"></div>

          <button type="submit" id="btn-register-submit" class="btn btn-primary btn-block btn-lg btn-glow">
            Create Free Account ⚡
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
          Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Login Here</a>
        </div>
      </div>

    </div>
  </main>

  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/three.r134.min.js"></script>
  <script src="/assets/js/vanta.globe.min.js"></script>
  <script src="/assets/js/3d-scene.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupCaptcha('captcha-slot');

      // Check and pre-fill referral code from URL query parameter (e.g. ?ref=CODE or ?referral=CODE)
      const urlParams = new URLSearchParams(window.location.search);
      const refParam = urlParams.get('ref') || urlParams.get('referral');
      const refInput = document.getElementById('reg-referral-code');
      const refMsg = document.getElementById('referral-status-msg');
      const refBtn = document.getElementById('btn-verify-referral');

      // Load dynamic public settings for exact prize amount
      fetch('/api/settings').then(r => r.json()).then(data => {
        if (data.settings && data.settings.referral_reward_referee_npr) {
          const badge = document.getElementById('ref-bonus-badge');
          if (badge) {
            badge.textContent = `🎁 Both Get NPR ${data.settings.referral_reward_referee_npr} Bonus`;
          }
        }
      }).catch(() => {});

      async function verifyCode(codeVal) {
        if (!codeVal || !codeVal.trim()) {
          refMsg.style.display = 'none';
          return;
        }
        refMsg.style.display = 'block';
        refMsg.style.color = 'var(--text-dim)';
        refMsg.textContent = 'Verifying referral code...';

        try {
          const res = await fetch(`/api/referrals/validate?code=${encodeURIComponent(codeVal.trim())}`);
          const data = await res.json();
          if (data.valid) {
            refMsg.style.color = '#34d399';
            refMsg.innerHTML = `🟢 <strong>Valid code from ${escapeHtml(data.referrer_name)}!</strong> Both you and your friend will receive <strong>NPR ${data.reward_referee_npr}</strong> free wallet balance upon registration!`;
          } else if (data.limit_reached) {
            refMsg.style.color = '#f87171';
            refMsg.innerHTML = `🔴 <strong>Monthly Limit Reached:</strong> This referrer has already completed their limit of 1 referral this month. You can still register without this code.`;
          } else {
            refMsg.style.color = '#f87171';
            refMsg.textContent = `🔴 ${data.message || 'Invalid referral code.'}`;
          }
        } catch (e) {
          refMsg.style.color = '#f87171';
          refMsg.textContent = 'Could not verify referral code right now.';
        }
      }

      if (refBtn) {
        refBtn.addEventListener('click', () => {
          verifyCode(refInput.value);
        });
      }

      if (refInput) {
        refInput.addEventListener('blur', () => {
          if (refInput.value.trim().length >= 4) {
            verifyCode(refInput.value);
          }
        });
      }

      if (refParam && refInput) {
        refInput.value = refParam.toUpperCase().trim();
        verifyCode(refInput.value);
      }

      const form = document.getElementById('register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!Store.isCaptchaPassed) {
          showToast('Please check the human verification box before proceeding.', 'warning');
          return;
        }

        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPass = document.getElementById('reg-confirm-password').value;
        const referralCode = refInput ? refInput.value.trim().toUpperCase() : '';
        const btn = document.getElementById('btn-register-submit');

        if (password !== confirmPass) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        if (password.length < 6) {
          showToast('Password must be at least 6 characters long.', 'warning');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating Account...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name,
              email,
              phone,
              password,
              referral_code: referralCode || undefined
            })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            showToast(data.message || 'Registration failed.', 'error');
            btn.disabled = false;
            btn.textContent = 'Create Free Account ⚡';
            if (data.referral_invalid) {
              if (refMsg) {
                refMsg.style.display = 'block';
                refMsg.style.color = '#f87171';
                refMsg.textContent = `🔴 ${data.message}`;
              }
            }
            return;
          }

          if (data.token) {
            localStorage.setItem('wx_token', data.token);
          }

          if (data.referral_applied) {
            showToast(`Account created! NPR ${data.bonus_amount} referral bonus added to your wallet 🎁`, 'success');
          } else {
            showToast('Account registered successfully! Welcome to White X.', 'success');
          }

          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);

        } catch (err) {
          console.error('Registration error:', err);
          showToast('Server error while registering. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Create Free Account ⚡';
        }
      });
    });
  </script>
</body>
</html>
